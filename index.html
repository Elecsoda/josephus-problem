<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>约瑟夫问题 (Josephus Problem)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 自定义滚动条样式 */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #d1d5db; 
            border-radius: 4px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.3s ease-out forwards;
        }
        /* 简单的动画类 */
        .animate-bounce-custom {
            animation: bounce 1s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translate(-50%, -50%) scale(1.25); }
            50% { transform: translate(-50%, -65%) scale(1.25); }
        }
        /* 隐藏 input range 的默认样式以匹配更好看的效果 */
        input[type=range] {
            -webkit-appearance: none; 
            background: transparent; 
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #4f46e5;
            cursor: pointer;
            margin-top: -6px; 
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #e5e7eb;
            border-radius: 2px;
        }
    </style>
</head>
<body class="min-h-screen bg-gray-50 flex flex-col font-sans text-gray-800 overflow-x-hidden">

    <!-- 头部标题 -->
    <header class="bg-white border-b border-gray-200 p-3 md:p-4 shadow-sm z-10 sticky top-0">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2">
                <!-- Icon: Users -->
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-indigo-600 w-5 h-5 md:w-6 md:h-6"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <h1 class="text-lg md:text-xl font-bold text-gray-800">约瑟夫问题（Josephus Problem）</h1>
            </div>
            <div class="text-xs md:text-sm text-gray-500 hidden sm:block" id="header-desc">
                41人围坐，报数到2淘汰
            </div>
        </div>
    </header>

    <!-- 主布局 -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-2 md:p-4 grid grid-cols-1 lg:grid-cols-12 gap-4 md:gap-6">
        
        <!-- 右侧：可视化区域 (手机 order-1: 优先显示) -->
        <div class="order-1 lg:order-2 lg:col-span-9 flex flex-col gap-4">
            
            <!-- 主展示区 -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 flex-1 relative min-h-[350px] md:min-h-[500px] flex items-center justify-center overflow-hidden">
                
                <!-- 状态提示栏 (上方) -->
                <div class="absolute top-0 left-0 right-0 p-3 flex justify-between items-start z-10 pointer-events-none">
                    <div class="bg-white/90 backdrop-blur px-3 py-1.5 rounded-lg shadow border border-indigo-100">
                        <div class="text-[10px] text-gray-500 uppercase tracking-wider">当前报数</div>
                        <div class="text-xl font-mono font-bold text-indigo-600">
                            <span id="current-count-display">0</span> <span class="text-gray-300 text-sm">/ 2</span>
                        </div>
                    </div>
                    
                    <!-- 胜利文字显示 -->
                    <div id="winner-display" class="hidden animate-fadeIn bg-yellow-50 px-4 py-2 rounded-lg border border-yellow-200 shadow-sm flex items-center gap-2">
                        <!-- Icon: Trophy -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 text-yellow-500"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
                        <div>
                            <span class="text-xs text-yellow-700 block">最终幸存者</span>
                            <span class="text-xl font-black text-yellow-600" id="winner-id">#?</span>
                        </div>
                    </div>
                </div>

                <!-- 圆环容器 -->
                <div id="circle-container" class="relative w-full max-w-[340px] md:max-w-[600px] aspect-square mt-6">
                    <!-- Javascript will populate this -->
                    
                    <!-- 中心说明 -->
                    <div id="center-status" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-center text-gray-300 pointer-events-none select-none">
                        <span id="status-text-idle" class="text-xs md:text-sm bg-gray-50 px-2 py-1 rounded opacity-60">准备开始</span>
                        <span id="status-text-eliminated" class="hidden text-3xl md:text-4xl font-bold text-red-100">OUT</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 左侧：控制面板与数据 (手机 order-2: 下方显示) -->
        <div class="order-2 lg:order-1 lg:col-span-3 space-y-4 md:space-y-6">
            
            <!-- 控制面板 -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                <div class="flex items-center gap-2 mb-3 text-gray-700 font-semibold border-b pb-2">
                    <!-- Icon: Settings -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                    控制台
                </div>
                
                <div class="space-y-4">
                    <!-- 总人数设置 -->
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">总人数 (N)</label>
                        <div class="flex items-center gap-2">
                            <input type="range" id="people-range" min="2" max="100" value="41" class="flex-1 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                            <input type="number" id="people-input" min="2" max="100" value="41" class="w-16 px-2 py-1 text-center border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none disabled:bg-gray-100">
                        </div>
                    </div>

                    <!-- 动画速度 -->
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">动画速度 (<span id="speed-display">500</span>ms)</label>
                        <input type="range" id="speed-range" min="50" max="1000" step="50" value="500" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer" style="direction: rtl;">
                    </div>

                    <div class="grid grid-cols-2 gap-2 pt-2" id="controls-container">
                        <!-- Javascript will toggle buttons here -->
                        <button id="btn-play" class="flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white py-3 px-4 rounded-lg transition-colors col-span-2 active:scale-95 touch-manipulation">
                            <!-- Icon: Play -->
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                            自动开始
                        </button>

                        <button id="btn-pause" class="hidden flex items-center justify-center gap-2 bg-amber-500 hover:bg-amber-600 text-white py-3 px-4 rounded-lg transition-colors col-span-2 active:scale-95 touch-manipulation">
                            <!-- Icon: Pause -->
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                            暂停
                        </button>
                        
                        <button id="btn-replay" class="hidden flex items-center justify-center gap-2 bg-indigo-600 text-white py-3 px-4 rounded-lg hover:bg-indigo-700 col-span-2 shadow-lg animate-pulse">
                            <!-- Icon: RotateCcw -->
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 12"/><path d="M3 3v9h9"/></svg>
                            再玩一次
                        </button>

                        <button id="btn-step" class="flex items-center justify-center gap-1 bg-gray-100 hover:bg-gray-200 text-gray-700 py-3 px-2 rounded-lg transition-colors disabled:opacity-50 touch-manipulation disabled:cursor-not-allowed">
                            <!-- Icon: SkipForward -->
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
                            手动下一步
                        </button>

                        <button id="btn-reset" class="flex items-center justify-center gap-1 bg-gray-100 hover:bg-gray-200 text-gray-700 py-3 px-2 rounded-lg transition-colors disabled:opacity-50 touch-manipulation disabled:cursor-not-allowed">
                            <!-- Icon: RotateCcw -->
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 12"/><path d="M3 3v9h9"/></svg>
                            重置
                        </button>
                    </div>
                </div>
            </div>

            <!-- 状态面板：横向表格 -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex-1 flex flex-col min-h-[150px]">
                <h3 class="text-gray-700 font-semibold border-b pb-2 mb-2 flex justify-between items-center">
                    <span>淘汰记录</span>
                    <span class="text-xs bg-gray-100 px-2 py-1 rounded text-gray-500">
                        剩余: <span id="alive-count">41</span>
                    </span>
                </h3>
                
                <div class="flex-1 overflow-x-auto custom-scrollbar pb-1">
                    <div id="history-empty" class="text-gray-400 italic text-center py-4 text-sm">暂无淘汰</div>
                    <table id="history-table" class="hidden w-full text-center text-xs md:text-sm border-collapse min-w-max">
                        <tbody>
                            <!-- 第一行：次数 -->
                            <tr id="history-row-index">
                                <td class="p-2 border-b border-r bg-gray-50 font-semibold text-gray-600 sticky left-0 z-10 w-20">次数</td>
                            </tr>
                            <!-- 第二行：号码 -->
                            <tr id="history-row-id">
                                <td class="p-2 border-r bg-white font-semibold text-gray-600 sticky left-0 z-10 w-20 shadow-sm">淘汰号码</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <!-- 底部版权 -->
    <footer class="py-6 text-center text-gray-400 text-sm">
        @孙维刚教育研究院
    </footer>

    <script>
        // --- 状态管理 ---
        let totalPeople = 41;
        const step = 2;
        let people = [];
        let isRunning = false;
        let speed = 500;
        
        // 核心算法状态
        let currentIndex = -1;
        let currentCount = 0;
        let eliminatedHistory = [];
        let survivor = null;
        let gameStatus = 'idle'; // idle, counting, eliminating, finished
        
        let timerId = null;

        // DOM 元素引用
        const dom = {
            headerDesc: document.getElementById('header-desc'),
            circleContainer: document.getElementById('circle-container'),
            currentCountDisplay: document.getElementById('current-count-display'),
            winnerDisplay: document.getElementById('winner-display'),
            winnerId: document.getElementById('winner-id'),
            centerStatusIdle: document.getElementById('status-text-idle'),
            centerStatusEliminated: document.getElementById('status-text-eliminated'),
            
            peopleRange: document.getElementById('people-range'),
            peopleInput: document.getElementById('people-input'),
            speedRange: document.getElementById('speed-range'),
            speedDisplay: document.getElementById('speed-display'),
            
            btnPlay: document.getElementById('btn-play'),
            btnPause: document.getElementById('btn-pause'),
            btnReplay: document.getElementById('btn-replay'),
            btnStep: document.getElementById('btn-step'),
            btnReset: document.getElementById('btn-reset'),
            
            aliveCount: document.getElementById('alive-count'),
            historyEmpty: document.getElementById('history-empty'),
            historyTable: document.getElementById('history-table'),
            historyRowIndex: document.getElementById('history-row-index'),
            historyRowId: document.getElementById('history-row-id')
        };

        // --- 初始化 ---
        function initializeGame() {
            people = Array.from({ length: totalPeople }, (_, i) => ({
                id: i + 1,
                status: 'alive' // alive, dead, active
            }));
            currentIndex = -1;
            currentCount = 0;
            eliminatedHistory = [];
            survivor = null;
            gameStatus = 'idle';
            isRunning = false;
            
            if (timerId) clearTimeout(timerId);
            
            renderAll();
        }

        // --- 核心逻辑步骤 ---
        function performStep() {
            // 检查是否只剩一人
            const aliveCount = people.filter(p => p.status === 'alive' || p.status === 'active').length;
            if (aliveCount <= 1) {
                isRunning = false;
                gameStatus = 'finished';
                const winner = people.find(p => p.status === 'alive' || p.status === 'active');
                if (winner) survivor = winner.id;
                renderAll();
                return;
            }

            let nextIndex = currentIndex;
            let foundNext = false;
            let loopSafe = 0;

            // 寻找下一个活着的人
            while (!foundNext && loopSafe < people.length * 2) {
                nextIndex = (nextIndex + 1) % people.length;
                if (people[nextIndex].status !== 'dead') {
                    foundNext = true;
                }
                loopSafe++;
            }

            const nextCount = currentCount + 1;
            const isEliminationTurn = nextCount === step;

            // 更新当前报数状态
            currentCount = isEliminationTurn ? 0 : nextCount;
            currentIndex = nextIndex;

            // 清除之前的 active 状态
            people.forEach(p => {
                if (p.status === 'active') p.status = 'alive';
            });

            if (isEliminationTurn) {
                people[nextIndex].status = 'dead';
                eliminatedHistory.push(people[nextIndex].id);
                gameStatus = 'eliminating';
            } else {
                people[nextIndex].status = 'active';
                gameStatus = 'counting';
            }

            renderAll();
            
            // 如果正在运行，设置下一个定时器
            if (isRunning && gameStatus !== 'finished') {
                timerId = setTimeout(performStep, speed);
            }
        }

        // --- 渲染函数 ---
        function renderAll() {
            renderControls();
            renderHeaderDesc();
            renderStatusDisplay();
            renderCircle();
            renderHistory();
        }

        function renderHeaderDesc() {
            dom.headerDesc.textContent = `${totalPeople}人围坐，报数到2淘汰`;
            dom.aliveCount.textContent = people.filter(p => p.status !== 'dead').length;
        }

        function renderStatusDisplay() {
            // 当前报数
            dom.currentCountDisplay.textContent = currentCount;
            
            // 赢家显示
            if (survivor) {
                dom.winnerDisplay.classList.remove('hidden');
                dom.winnerId.textContent = `#${survivor}`;
            } else {
                dom.winnerDisplay.classList.add('hidden');
            }

            // 中心文字
            if (gameStatus === 'idle') {
                dom.centerStatusIdle.classList.remove('hidden');
                dom.centerStatusEliminated.classList.add('hidden');
            } else if (gameStatus === 'eliminating') {
                dom.centerStatusIdle.classList.add('hidden');
                dom.centerStatusEliminated.classList.remove('hidden');
            } else {
                dom.centerStatusIdle.classList.add('hidden');
                dom.centerStatusEliminated.classList.add('hidden');
            }
        }

        function renderControls() {
            // 输入框禁用状态
            dom.peopleRange.disabled = isRunning;
            dom.peopleInput.disabled = isRunning;

            // 按钮显示逻辑
            if (gameStatus === 'finished') {
                dom.btnPlay.classList.add('hidden');
                dom.btnPause.classList.add('hidden');
                dom.btnReplay.classList.remove('hidden');
                
                dom.btnStep.disabled = true;
                dom.btnStep.classList.add('cursor-not-allowed');
                
                dom.btnReset.disabled = true; // 结束后主要用上面的大按钮重置
                dom.btnReset.classList.add('cursor-not-allowed');
            } else {
                dom.btnReplay.classList.add('hidden');
                dom.btnStep.disabled = isRunning;
                dom.btnStep.classList.toggle('cursor-not-allowed', isRunning);
                
                dom.btnReset.disabled = false;
                dom.btnReset.classList.remove('cursor-not-allowed');

                if (isRunning) {
                    dom.btnPlay.classList.add('hidden');
                    dom.btnPause.classList.remove('hidden');
                } else {
                    dom.btnPlay.classList.remove('hidden');
                    dom.btnPause.classList.add('hidden');
                }
            }
        }

        function renderCircle() {
            // 清空容器，保留中心说明
            const centerStatus = dom.circleContainer.querySelector('#center-status');
            dom.circleContainer.innerHTML = '';
            dom.circleContainer.appendChild(centerStatus);

            const isCrowded = totalPeople > 50;
            const isVeryCrowded = totalPeople > 80;

            people.forEach((person, index) => {
                const angle = (index / totalPeople) * 2 * Math.PI - Math.PI / 2;
                
                const circleRadius = isCrowded ? 36 : 40;
                const labelRadius = 45;

                const cx = 50 + circleRadius * Math.cos(angle);
                const cy = 50 + circleRadius * Math.sin(angle);
                const lx = 50 + labelRadius * Math.cos(angle);
                const ly = 50 + labelRadius * Math.sin(angle);

                // 样式计算
                let sizeClass = 'w-8 h-8 md:w-10 md:h-10 text-xs md:text-sm';
                if (isVeryCrowded) {
                    sizeClass = 'w-1.5 h-1.5 md:w-2 md:h-2 text-[0px]';
                } else if (isCrowded) {
                    sizeClass = 'w-2.5 h-2.5 md:w-3 md:h-3 text-[0px]';
                } else if (totalPeople > 30) {
                    sizeClass = 'w-5 h-5 text-[9px]';
                }

                let statusClass = "bg-green-500 text-white border-green-600";
                if (person.status === 'dead') statusClass = "bg-gray-100 text-gray-300 border-gray-200 scale-50 opacity-40";
                if (person.status === 'active') statusClass = "bg-blue-500 text-white border-blue-600 scale-125 ring-2 md:ring-4 ring-blue-200 z-10 shadow-lg";
                if (survivor === person.id) statusClass = "bg-yellow-400 text-yellow-900 border-yellow-500 scale-125 ring-2 md:ring-4 ring-yellow-200 z-10 animate-bounce-custom";

                // 创建外侧标签
                if (isCrowded) {
                    const label = document.createElement('div');
                    label.className = `absolute font-sans leading-none transition-all duration-300 transform -translate-x-1/2 -translate-y-1/2
                        ${isVeryCrowded ? 'text-[7px] md:text-[8px]' : 'text-[9px] md:text-[10px]'}
                        ${person.status === 'dead' ? 'text-gray-200 opacity-50' : 'text-gray-500 font-medium'}
                        ${person.status === 'active' || survivor === person.id ? 'font-bold text-indigo-600 scale-125 z-20' : ''}`;
                    label.style.left = `${lx}%`;
                    label.style.top = `${ly}%`;
                    label.textContent = person.id;
                    dom.circleContainer.appendChild(label);
                }

                // 创建圆点
                const dot = document.createElement('div');
                dot.className = `absolute rounded-full flex items-center justify-center font-bold border transition-all duration-300 shadow-sm ${sizeClass} ${statusClass}`;
                dot.style.left = `${cx}%`;
                dot.style.top = `${cy}%`;
                dot.style.transform = 'translate(-50%, -50%)';
                
                // 显示数字逻辑
                if (!isCrowded || person.status === 'active' || survivor === person.id) {
                    dot.textContent = person.id;
                }

                dom.circleContainer.appendChild(dot);
            });
        }

        function renderHistory() {
            if (eliminatedHistory.length === 0) {
                dom.historyEmpty.classList.remove('hidden');
                dom.historyTable.classList.add('hidden');
                return;
            }

            dom.historyEmpty.classList.add('hidden');
            dom.historyTable.classList.remove('hidden');

            // 只需要更新最后添加的列，但为了简单起见，这里可以重建表格行（性能在100数据下可忽略）
            // 或者只在数据长度变化时追加。这里为了逻辑简单，重置内容。
            // 优化：重置所有 dynamic cells
            
            // 清除旧的 cells (保留第一个 header cell)
            while (dom.historyRowIndex.children.length > 1) {
                dom.historyRowIndex.removeChild(dom.historyRowIndex.lastChild);
                dom.historyRowId.removeChild(dom.historyRowId.lastChild);
            }

            eliminatedHistory.forEach((id, idx) => {
                const tdIndex = document.createElement('td');
                tdIndex.className = 'p-2 border-b min-w-[3rem] text-gray-500';
                tdIndex.textContent = idx + 1;
                dom.historyRowIndex.appendChild(tdIndex);

                const tdId = document.createElement('td');
                tdId.className = 'p-2 min-w-[3rem] font-bold text-red-600 animate-fadeIn';
                tdId.textContent = `#${id}`;
                dom.historyRowId.appendChild(tdId);
            });
            
            // 自动滚动到最右侧
            const scrollContainer = dom.historyTable.parentElement;
            scrollContainer.scrollLeft = scrollContainer.scrollWidth;
        }

        // --- 事件监听 ---

        dom.peopleRange.addEventListener('input', (e) => {
            const val = parseInt(e.target.value) || 2;
            setTotalPeople(val);
        });

        dom.peopleInput.addEventListener('input', (e) => {
            const val = parseInt(e.target.value) || 2;
            setTotalPeople(val);
        });

        function setTotalPeople(val) {
            totalPeople = val;
            dom.peopleRange.value = val;
            dom.peopleInput.value = val;
            setIsRunning(false);
            initializeGame();
        }

        dom.speedRange.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            speed = val;
            dom.speedDisplay.textContent = val;
        });

        function setIsRunning(running) {
            isRunning = running;
            if (timerId) clearTimeout(timerId);
            
            if (isRunning) {
                timerId = setTimeout(performStep, speed);
            }
            renderControls();
        }

        dom.btnPlay.addEventListener('click', () => setIsRunning(true));
        dom.btnPause.addEventListener('click', () => setIsRunning(false));
        
        dom.btnStep.addEventListener('click', () => {
            if (!isRunning && gameStatus !== 'finished') {
                performStep();
            }
        });

        dom.btnReset.addEventListener('click', initializeGame);
        dom.btnReplay.addEventListener('click', initializeGame);

        // 启动
        initializeGame();

    </script>
</body>
</html>
